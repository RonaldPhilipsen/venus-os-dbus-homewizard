[DEFAULT]
# Minutes between sign-of-life log lines
SignOfLifeLog = 10
# Seconds between two polls of each meter
PollIntervalSeconds = 1
# Seconds without a new measurement before the meter counts as offline. Empty means 5 for a kWh meter and 15 for a P1 Meter
OfflineTimeoutSeconds =

[METER:heatpump]
# Address of the meter, an IP address or a host name (required)
Host = 192.168.1.30
# API token from pair.py, 32 hex characters (required)
Token = 0123456789ABCDEF0123456789ABCDEF
# First role of the meter. After the first start, the role on the GX screen applies
Role = heatpump
# Device instance number on D-Bus. Empty or missing means 40 plus the section index
DeviceInstance = 40
# First name of the meter. After the first start, the name on the GX screen applies
CustomName = Heat pump

[METER:p1]
# Address of the P1 Meter, an IP address or a host name (required)
Host = 192.168.1.31
# API token from pair.py, 32 hex characters (required)
Token = FEDCBA9876543210FEDCBA9876543210
# First role of the P1 Meter. A P1 Meter allows the grid role only
Role = grid
# Device instance number on D-Bus
DeviceInstance = 41
